[project]
name = "clank"
version = "0.0.1"
description = "Pose chunks in, joint commands out, for any robot with a URDF"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pin", "pin-pink", "qpsolvers[daqp]", "av"]

[project.optional-dependencies]
yam = ["python-can"]
realsense = ["pyrealsense2"]
nerve = ["opencv-python-headless"]
anthropic = ["opencv-python-headless", "anthropic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clank"]

[tool.hatch.build.targets.sdist]
exclude = ["/runs", "/tests"]
